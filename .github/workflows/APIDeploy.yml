name: Deploy API

env:
  AZURE_WEBAPP_NAME: gimnasiojena
  AZURE_WEBAPP_PACKAGE_PATH: './GimnasioJena.UI'

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'BD/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Build with MSBuild
        run: msbuild ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} /p:Configuration=Release

      - name: Publish with MSBuild
        run: msbuild ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
